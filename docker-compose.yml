# Local development database. Production runs on a managed Postgres in a
# Canadian region (see README → Deployment).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: imedica
      POSTGRES_PASSWORD: imedica_dev
      POSTGRES_DB: imedica
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - imedica-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imedica"]
      interval: 5s
      retries: 10

volumes:
  imedica-pg:
